
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MY LIBRARY</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    
    <header>
        <div class="container">
            <div class="nav">
                <img src="logo.png" alt="Library Logo">
                <div>
                <h1 class="line"> MY LIBRARY</h1>
                <h3 class="line"> DISCOVER.READ.GROW.</h3>
                    </div>
            </div>
        <nav>
            <div class="nav-links">
                
                 <a href="login.html" class="active">Login</a>
                <a href="home.html" class="active">Home</a>
                <a href="books.html" class="active">Books</a>
                <a href="about.html" class="active">About Us</a>
                <a href="students.html" class="active">Students</a>
                <a href="admin.html" class="active">Admin</a>

            </div>
        </nav>
        </div>
    </header>

    <hr>


    <main>

        <div class="page-heading">
            <h1>Login to Your Account</h1>
            <p>Welcome back! Continue your reading journey with us.</p>
        </div>

        
        <section class="login-section">

            <div class="login-container">

                <h2>Welcome Back!</h2>
                <p class="login-subtitle">Please enter your details to login.</p>

                <form action="#" method="post">

                    
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>

                    
                    <div class="login-options">
                        <label>
                            <input type="checkbox">
                            Remember Me
                        </label>
                    </div>

                    
                    <button type="submit" class="login-btn">Login</button>

                </form>

                
                <p class="signup-text">
                    Don't have an account?
                    <a href="signup.html">Sign Up</a>
                </p>

            </div>

        </section>

    </main>

    <hr>

    
    <footer class="footer">
        <p>© 2026 MY LIBRARY. All Rights Reserved.</p>
    </footer>

</body>
</html>
