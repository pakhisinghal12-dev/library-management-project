
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | MY LIBRARY</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    
    <header>
      <div class="container">
            <div class="nav">
                <img src="logo.png" alt="Library Logo">
                <div>
                <h1 class="line"> MY LIBRARY</h1>
                <h3 class="line"> DISCOVER.READ.GROW.</h3>
                    </div>
            </div>
        <nav>
            <div class="nav-links">
                 <a href="login.html" class="active">Login</a>
                <a href="home.html" class="active">Home</a>
                <a href="books.html" class="active">Books</a>
                <a href="about.html" class="active">About Us</a>
                <a href="students.html" class="active">Students</a>
                <a href="admin.html" class="active">Admin</a>

            </div>
        </nav>
        </div> 
    </header>

    <hr>

    
    <main>

        <div class="page-heading">
            <h1>Create Your Account</h1>
            <p>Join us and start your reading journey.</p>
        </div>

        
        <section class="signup-section">

            <div class="signup-container">

                <h2>Sign Up</h2>
                <p class="signup-subtitle">Enter your details to create an account.</p>

                <form action="#" method="post">


                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name" required>
                    </div>

            
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

            
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create a password" required>
                    </div>

                    
                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="Re-enter your password" required>
                    </div>

            
                    <button type="submit" class="signup-btn">Create Account</button>

                </form>

            
                <p class="login-text">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>

        </section>

    </main>

    <hr>

    
    <footer class="footer">
        <p>© 2026 MY LIBRARY. All Rights Reserved.</p>
    </footer>

</body>
</html>
